<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Projects</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding-top: 50px;
        }
        
        h1, h2 {
            text-shadow: 0 0 5px #0f0;
            animation: flicker 3s infinite;
        }
        
        h1 {
            margin-top: 80px;
            position: relative;
        }
        
        .projects {
            margin: 40px 0;
            padding: 20px;
            border: 1px solid #0f0;
            box-shadow: 0 0 10px #0f0;
        }
        
        .project-item {
            margin: 15px 0;
            padding: 10px;
            border-bottom: 1px dashed #0f0;
        }
        
        a {
            color: #0f0;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        a:hover {
            text-shadow: 0 0 10px #0f0;
            letter-spacing: 1px;
        }
        
        .about {
            margin-top: 60px;
            padding: 20px;
            border: 1px solid #0f0;
            box-shadow: 0 0 10px #0f0;
        }
        
        .flare {
            position: absolute;
            background: radial-gradient(circle, rgba(0,255,0,0.4) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            animation: fadeInOut 5s infinite;
        }
        
        @keyframes flicker {
            0% { opacity: 1; }
            3% { opacity: 0.8; }
            6% { opacity: 1; }
            7% { opacity: 0.9; }
            9% { opacity: 1; }
            50% { opacity: 1; }
            52% { opacity: 0.8; }
            54% { opacity: 1; }
            100% { opacity: 1; }
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.8); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(0.8); }
        }
        
        .typing-effect {
            overflow: hidden;
            border-right: 2px solid #0f0;
            white-space: nowrap;
            margin: 0 auto;
            animation: typing 3.5s steps(40, end) forwards, blink-caret 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0 }
            to { width: 100%; border-right: transparent; }
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #0f0 }
        }
        
        .floating {
            animation: float 6s ease-in-out infinite;
            transform-origin: center;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="typing-effect">sotano del chivato</h1>
        
        <div class="projects">
            <h2>Projects List</h2>
            <div id="projects-container">
                <!-- Projects will be loaded here -->
            </div>
        </div>
        
        <div class="about">
            <h2>About Me</h2>
            <div id="about-content">
                <!-- Replace this with your about me content -->
                <p>Hacker living in Lisbon funelling fidgeting into breaking & building.</p>
                <p>Contact me at:</p>
                <p>TG: @chivato</p>
                <p>IG: @chyv</p>
                <p>Twitter: @SecGus</p>
            </div>
        </div>
    </div>
    
    <script>
        // Create random flares in the background
        function createFlares() {
            const body = document.body;
            const maxFlares = 10;
            
            for (let i = 0; i < maxFlares; i++) {
                setTimeout(() => {
                    const flare = document.createElement('div');
                    flare.classList.add('flare');
                    
                    const size = Math.random() * 300 + 50;
                    const posX = Math.random() * window.innerWidth;
                    const posY = Math.random() * window.innerHeight;
                    
                    flare.style.width = `${size}px`;
                    flare.style.height = `${size}px`;
                    flare.style.left = `${posX}px`;
                    flare.style.top = `${posY}px`;
                    flare.style.animationDelay = `${Math.random() * 5}s`;
                    
                    body.appendChild(flare);
                    
                    setTimeout(() => {
                        body.removeChild(flare);
                    }, 5000);
                    
                }, i * 1000);
            }
            
            setTimeout(createFlares, 10000);
        }
        
        // Load projects from JSON file
        async function loadProjects() {
            try {
                const response = await fetch('/projects.json');
                const projects = await response.json();
                const projectsContainer = document.getElementById('projects-container');
                
                projects.forEach(project => {
                    const projectElement = document.createElement('div');
                    projectElement.classList.add('project-item');
                    
                    projectElement.innerHTML = `
                        <a href="${project.link}">${project.project}</a>
                    `;
                    
                    projectsContainer.appendChild(projectElement);
                });
            } catch (error) {
                console.error('Error loading projects:', error);
                document.getElementById('projects-container').innerHTML = '<p>Error loading projects. Please check your projects.json file.</p>';
            }
        }
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            loadProjects();
            createFlares();
            
            // Add some floating elements for movement
            const h1Elements = document.querySelectorAll('h1');
            h1Elements.forEach(el => {
                el.classList.add('floating');
            });
        });
    </script>
</body>
</html>
