<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding-top: 20px;
        }
        
        h1, h2 {
            text-shadow: 0 0 5px #0f0, 0 0 10px #0f0;
        }
        
        h1 {
            margin: 0;
            position: relative;
            width: 100%;
            animation: neon-flicker 4s infinite;
            font-size: 24px;
        }
        
        .projects {
            margin: 40px 0;
            padding: 20px;
            border: 1px solid #0f0;
            box-shadow: 0 0 10px #0f0;
        }
        
        .project-item {
            margin: 15px 0;
            padding: 10px;
            border-bottom: 1px dashed #0f0;
        }
        
        a {
            color: #0f0;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        a:hover {
            text-shadow: 0 0 10px #0f0;
            animation: link-flicker 1s infinite;
        }
        
        @keyframes link-flicker {
            0% { opacity: 1; }
            25% { opacity: 0.5; }
            50% { opacity: 1; }
            60% { opacity: 0.7; }
            75% { opacity: 1; }
            100% { opacity: 1; }
        }
        
        .title-container {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 100;
            margin: 0;
            background-color: transparent;
            padding: 10px 15px;
            border: none;
            box-shadow: none;
        }
        
        .about {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #0f0;
            box-shadow: 0 0 10px #0f0;
        }
        
        .flare {
            position: fixed;
            background: radial-gradient(circle, rgba(0,255,0,0.4) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            animation: fadeInOut 5s infinite;
            will-change: opacity; /* Hint to browser to optimize animations */
        }
        
        @keyframes flicker {
            0% { opacity: 1; }
            3% { opacity: 0.8; }
            6% { opacity: 1; }
            7% { opacity: 0.9; }
            9% { opacity: 1; }
            50% { opacity: 1; }
            52% { opacity: 0.8; }
            54% { opacity: 1; }
            100% { opacity: 1; }
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; }
            50% { opacity: 0.5; }
            100% { opacity: 0; }
        }
        
        .typing-effect {
            overflow: hidden;
            border-right: 2px solid #0f0;
            white-space: nowrap;
            margin: 0 auto;
            animation: typing 3.5s steps(40, end) forwards, blink-caret 0.75s step-end infinite;
        }
        
        @keyframes typing {
            from { width: 0 }
            to { width: 100%; border-right: transparent; }
        }
        
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #0f0 }
        }
        
        .floating {
            animation: none;
        }
        
        @keyframes float {
            0% { transform: none; }
            50% { transform: none; }
            100% { transform: none; }
        }
        
        .soundcloud-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid #0f0;
            box-shadow: 0 0 10px #0f0;
            animation: flicker 4s infinite;
            transition: all 0.3s;
        }
        
        .soundcloud-badge:hover {
            box-shadow: 0 0 20px #0f0;
            transform: scale(1.05);
        }
        
        .soundcloud-badge img {
            margin-right: 10px;
            height: 24px;
        }
        
        /* Socials dropdown styles */
        .socials-container {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 100;
            display: flex;
            gap: 15px;
            background-color: transparent;
            padding: 10px 15px;
            border: none;
            box-shadow: none;
            border-radius: 0;
        }
        
        .socials-container a {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0f0;
            transition: all 0.3s;
        }
        
        .socials-container a:hover {
            transform: scale(1.2);
            filter: drop-shadow(0 0 5px #0f0);
        }
        
        .socials-container img {
            height: 24px;
            width: 24px;
        }

        .socials-btn {
            display: none;
        }
        
        .socials-content {
            display: none;
        }
        
        .show {
            display: block;
        }
        
        @keyframes glitch-in {
            0% {
                clip-path: inset(100% 0 0 0);
                transform: translateY(-10px);
            }
            20% {
                clip-path: inset(45% 0 54% 0);
                transform: translateY(-5px);
            }
            40% {
                clip-path: inset(23% 0 76% 0);
                transform: translateY(-2px);
            }
            60% {
                clip-path: inset(67% 0 33% 0);
                transform: translateY(-1px);
            }
            80% {
                clip-path: inset(14% 0 85% 0);
                transform: translateY(-0.5px);
            }
            100% {
                clip-path: inset(0 0 0 0);
                transform: translateY(0);
            }
        }
        
        @keyframes neon-flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% {
                opacity: 1;
                text-shadow: 0 0 5px #0f0, 0 0 10px #0f0, 0 0 20px #0f0;
            }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% {
                opacity: 0.4;
                text-shadow: none;
            }
        }
        
        .title-desktop {
            display: block;
        }
        
        .title-mobile {
            display: none;
        }
        
        /* Media query for mobile devices */
        @media screen and (max-width: 768px) {
            .title-desktop {
                display: none;
            }
            
            .title-mobile {
                display: block;
            }
            
            .title-container {
                top: 20px;
                left: 20px;
            }
            
            .socials-container {
                top: 20px;
                right: 20px;
                gap: 10px;
            }
            
            .socials-container img {
                height: 20px;
                width: 20px;
            }
            
            .container {
                padding-top: 60px;
            }
            
            .about {
                margin-top: 40px;
            }
        }
    </style>
</head>

    <script>
        // Create random flares in the background
        function createFlares() {
            const body = document.body;
            const maxFlares = 10;
            const flareContainer = document.createElement('div');
            flareContainer.style.position = 'fixed';
            flareContainer.style.top = '0';
            flareContainer.style.left = '0';
            flareContainer.style.width = '100%';
            flareContainer.style.height = '100%';
            flareContainer.style.pointerEvents = 'none';
            flareContainer.style.zIndex = '0';
            document.body.appendChild(flareContainer);
            
            for (let i = 0; i < maxFlares; i++) {
                setTimeout(() => {
                    const flare = document.createElement('div');
                    flare.classList.add('flare');
                    
                    const size = Math.random() * 300 + 50;
                    const posX = Math.random() * window.innerWidth;
                    const posY = Math.random() * window.innerHeight;
                    
                    flare.style.width = `${size}px`;
                    flare.style.height = `${size}px`;
                    flare.style.left = `${posX}px`;
                    flare.style.top = `${posY}px`;
                    flare.style.animationDelay = `${Math.random() * 5}s`;
                    
                    flareContainer.appendChild(flare);
                    
                    setTimeout(() => {
                        flareContainer.removeChild(flare);
                    }, 5000);
                    
                }, i * 1000);
            }
            
            setTimeout(createFlares, 10000);
        }
        
        // Load projects from JSON file
        async function loadProjects() {
            try {
                const response = await fetch('/projects.json');
                const projects = await response.json();
                const projectsContainer = document.getElementById('projects-container');
                
                projects.forEach(project => {
                    const projectElement = document.createElement('div');
                    projectElement.classList.add('project-item');
                    
                    projectElement.innerHTML = `
                        <a href="${project.link}">${project.project}</a>
                    `;
                    
                    projectsContainer.appendChild(projectElement);
                });
            } catch (error) {
                console.error('Error loading projects:', error);
                document.getElementById('projects-container').innerHTML = '<p>Error loading projects. Please check your projects.json file.</p>';
            }
        }
        
        // Toggle socials dropdown
        function toggleSocials() {
            document.getElementById("socialsDropdown").classList.toggle("show");
        }
        
        // Close dropdown when clicking outside
        window.onclick = function(event) {
            if (!event.target.matches('.socials-btn')) {
                const dropdowns = document.getElementsByClassName("socials-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
        
        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            loadProjects();
            createFlares();

        });
